name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build
      - run: find . -name "*.jar" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: mob-battle-jar
          path: build/libs/*.jar
